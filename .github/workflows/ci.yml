name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    name: Skills and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm

      - run: npm ci
      - run: npm run check:text-hygiene
      - run: npm run check:skills
      - run: npm run check:nestjs-pack
      - run: npm run check:audit
      - name: Admit native cleanup fixtures
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export SDCOREJS_CLEANUP_POSIX_FIXTURE_ROOT="$(mktemp -d "$HOME/sdcorejs-cleanup-ci.XXXXXXXX")"
          export SDCOREJS_CLEANUP_PYTHON="$(readlink -f /usr/bin/python3)"
          test -x "$SDCOREJS_CLEANUP_PYTHON"
          "$SDCOREJS_CLEANUP_PYTHON" -I -S -B - <<'PY'
          import errno, os
          selected = [os.environ['SDCOREJS_CLEANUP_PYTHON'],
                      os.path.join(os.getcwd(), '_refs/cleanup/safe-file-operation.py'),
                      os.environ['SDCOREJS_CLEANUP_POSIX_FIXTURE_ROOT']]
          checked = set()
          for selected_path in selected:
              current = os.path.realpath(selected_path)
              while current not in checked:
                  checked.add(current)
                  for attribute in ('system.posix_acl_access', 'system.posix_acl_default'):
                      try:
                          os.getxattr(current, attribute)
                      except OSError as error:
                          if error.errno != errno.ENODATA:
                              raise
                      else:
                          print('Native admission ACL boundary:', current, attribute)
                  parent = os.path.dirname(current)
                  if parent == current:
                      break
                  current = parent
          PY
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { inspectCleanupPosixCapabilities } from './_refs/cleanup/posix-file-operation.mjs';
          const result = await inspectCleanupPosixCapabilities({
            root: process.env.SDCOREJS_CLEANUP_POSIX_FIXTURE_ROOT,
            python: process.env.SDCOREJS_CLEANUP_PYTHON,
          });
          assert.equal(result.supported, true, JSON.stringify(result));
          assert.equal(result.profile.filesystem, 'ext4');
          NODE
          printf '%s\n' \
            "SDCOREJS_CLEANUP_POSIX_FIXTURE_ROOT=$SDCOREJS_CLEANUP_POSIX_FIXTURE_ROOT" \
            "SDCOREJS_CLEANUP_PYTHON=$SDCOREJS_CLEANUP_PYTHON" >> "$GITHUB_ENV"
      - run: npm run test:e2e

  site:
    name: Site Build and Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site
      - run: npm run check:audit
        working-directory: site
      - run: npm run build
        working-directory: site

  powershell:
    name: PowerShell Skill Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm

      - run: npm ci
      - run: npm run check:text-hygiene
      - run: npm run check:skills:ps

  visual-companion-node18:
    name: Visual Companion (Node 18.20.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 18.20.8

      - run: node --test test/e2e/visual-companion-runtime.test.mjs test/e2e/static-visual-composer.test.mjs
