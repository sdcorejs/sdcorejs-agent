name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    name: Skills and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm

      - name: Prepare private native cleanup checkout
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ci_root="$(sudo mktemp -d /sdcorejs-cleanup-ci.XXXXXXXX)"
          case "$ci_root" in /sdcorejs-cleanup-ci.*) ;; *) exit 1 ;; esac
          test "$(dirname "$ci_root")" = /
          test -d "$ci_root" && test ! -L "$ci_root"
          sudo chown "$(id -u):$(id -g)" "$ci_root"
          git clone --no-local --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$ci_root/repository"
          git -C "$ci_root/repository" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$ci_root/repository" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$ci_root/repository" remote set-url origin https://github.com/sdcorejs/sdcorejs-agent
          printf '%s\n' \
            "SDCOREJS_CLEANUP_CI_ROOT=$ci_root" \
            "SDCOREJS_CLEANUP_CI_REPOSITORY=$ci_root/repository" >> "$GITHUB_ENV"

      - run: npm ci
        working-directory: ${{ env.SDCOREJS_CLEANUP_CI_REPOSITORY }}
      - run: npm run check:text-hygiene
        working-directory: ${{ env.SDCOREJS_CLEANUP_CI_REPOSITORY }}
      - run: npm run check:skills
        working-directory: ${{ env.SDCOREJS_CLEANUP_CI_REPOSITORY }}
      - run: npm run check:nestjs-pack
        working-directory: ${{ env.SDCOREJS_CLEANUP_CI_REPOSITORY }}
      - run: npm run check:audit
        working-directory: ${{ env.SDCOREJS_CLEANUP_CI_REPOSITORY }}
      - name: Admit native cleanup fixtures
        shell: bash
        working-directory: ${{ env.SDCOREJS_CLEANUP_CI_REPOSITORY }}
        run: |
          set -euo pipefail
          umask 077
          export SDCOREJS_CLEANUP_POSIX_FIXTURE_ROOT="$SDCOREJS_CLEANUP_CI_ROOT/fixtures"
          mkdir -- "$SDCOREJS_CLEANUP_POSIX_FIXTURE_ROOT"
          export SDCOREJS_CLEANUP_PYTHON="$(readlink -f /usr/bin/python3)"
          test -x "$SDCOREJS_CLEANUP_PYTHON"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { inspectCleanupPosixCapabilities } from './_refs/cleanup/posix-file-operation.mjs';
          const result = await inspectCleanupPosixCapabilities({
            root: process.env.SDCOREJS_CLEANUP_POSIX_FIXTURE_ROOT,
            python: process.env.SDCOREJS_CLEANUP_PYTHON,
          });
          assert.equal(result.supported, true, JSON.stringify(result));
          assert.equal(result.profile.filesystem, 'ext4');
          NODE
          printf '%s\n' \
            "SDCOREJS_CLEANUP_POSIX_FIXTURE_ROOT=$SDCOREJS_CLEANUP_POSIX_FIXTURE_ROOT" \
            "SDCOREJS_CLEANUP_PYTHON=$SDCOREJS_CLEANUP_PYTHON" >> "$GITHUB_ENV"
      - run: npm run test:e2e
        working-directory: ${{ env.SDCOREJS_CLEANUP_CI_REPOSITORY }}

  site:
    name: Site Build and Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site
      - run: npm run check:audit
        working-directory: site
      - run: npm run build
        working-directory: site

  powershell:
    name: PowerShell Skill Check
    runs-on: windows-latest
    steps:
      # Preserved evaluation fixtures include nested content-addressed paths.
      - name: Enable long paths before checkout
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm

      - run: npm ci
      - run: npm run check:text-hygiene
      - run: npm run check:skills:ps

  visual-companion-node18:
    name: Visual Companion (Node 18.20.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 18.20.8

      - run: node --test test/e2e/visual-companion-runtime.test.mjs test/e2e/static-visual-composer.test.mjs

  release-preview:
    name: Release preview (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths before checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run test:e2e:release
      - name: Build and verify non-publishing preview
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.mjs build --tag 1.0.0 --preview --out "$RUNNER_TEMP/sdcorejs-preview" > "$RUNNER_TEMP/preview-build.json"
          cd "$RUNNER_TEMP/sdcorejs-preview"
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: sdcorejs-agent-1.0.0-preview
          path: |
            ${{ runner.temp }}/sdcorejs-preview/*.tgz
            ${{ runner.temp }}/sdcorejs-preview/*.zip
            ${{ runner.temp }}/sdcorejs-preview/release-manifest.json
            ${{ runner.temp }}/sdcorejs-preview/SHA256SUMS
            ${{ runner.temp }}/sdcorejs-preview/release-notes.md
          if-no-files-found: error
