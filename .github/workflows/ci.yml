name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    name: Skills and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check:text-hygiene
      - run: npm run check:skills
      - run: npm run check:audit
      - run: npm run test:e2e

  site:
    name: Site Build and Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site
      - run: npm run check:audit
        working-directory: site
      - run: npm run build
        working-directory: site

  powershell:
    name: PowerShell Skill Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check:text-hygiene
      - run: npm run check:skills:ps
